repos:
  # Ruff - Fast Python linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      # Run the linter with auto-fix
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # General pre-commit hooks (lightweight, fast)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # File checks
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      
      # Code cleanup
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      
      # Python syntax
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements

  # commitizen - Conventional commits (optional - can be skipped with --no-verify)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

# Note: Heavy checks (mypy, bandit, pytest) are run in CI, not locally
# This keeps pre-commit fast and developer-friendly
# Run manually if needed: uv run mypy src/, uv run pytest
